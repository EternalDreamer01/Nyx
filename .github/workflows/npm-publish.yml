name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: touch .env && npm ci && npm test
        env:
          API_TELEGRAM_ID: ${{ secrets.API_TELEGRAM_ID }}
          API_TELEGRAM_HASH: ${{ secrets.API_TELEGRAM_HASH }}
          API_TELEGRAM_TOKEN: ${{ secrets.API_TELEGRAM_TOKEN }}
          PHONE_TEST: ${{ secrets.PHONE_TEST }}
          DEFAULT_INFO_FORMAT: ${{ vars.DEFAULT_INFO_FORMAT }}
          AUTOSAVE: true
          DEFAULT_API: all
          DEFAULT_COLOUR: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance --access public
